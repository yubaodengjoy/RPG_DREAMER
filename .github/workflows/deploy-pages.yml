name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    # The actual site and games are deployed to Cloudflare. GitHub Pages only
    # publishes this wrapper, so unrelated game updates need no Pages deploy.
    paths:
      - 'github-redirect/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Let the Pages backend finish before another deployment is submitted.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble redirect-only site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp github-redirect/index.html _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
